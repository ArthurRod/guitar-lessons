client.svelte.Cs0QybAo.js" props="{&quot;posts&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;aula-1-primeiro-contato&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Aula 1 — Primeiro contato com o violão + primeira música&quot;],&quot;description&quot;:[0,&quot;Conheça o violão sem teoria pesada, aprenda os primeiros acordes (D, G, A) e toque uma música worship simples já no primeiro dia.&quot;],&quot;author&quot;:[0,&quot;Arca Wave&quot;],&quot;tags&quot;:[0,&quot;violão, aula 1, iniciante, worship, acordes D G A, primeira música&quot;],&quot;pubDate&quot;:[3,&quot;2026-04-30T03:00:00.000Z&quot;],&quot;heroImage&quot;:[0,&quot;/jpg/aula-1-hero.jpg&quot;]}],&quot;body&quot;:[0,&quot;&lt;div class=\&quot;callout goal\&quot;&gt;\n  &lt;strong&gt;🎯 Objetivos da aula&lt;/strong&gt;\n  &lt;ul&gt;\n    &lt;li&gt;Conhecer o violão (sem excesso de teoria)&lt;/li&gt;\n    &lt;li&gt;Aprender os primeiros acordes&lt;/li&gt;\n    &lt;li&gt;Entender o que é harmonia básica&lt;/li&gt;\n    &lt;li&gt;Tocar uma música worship simples já na primeira aula&lt;/li&gt;\n    &lt;li&gt;Introduzir o conceito de graus (1, 4, 5)&lt;/li&gt;\n  &lt;/ul&gt;\n&lt;/div&gt;\n\n## 🪵 1. Conhecendo o violão (rápido e prático)\n\nExplique apenas o essencial:\n\n- **Braço** → onde fazemos os acordes\n- **Trastes** → divisões das notas\n- **Cordas** → de baixo para cima: **E A D G B E**\n\n&lt;div class=\&quot;callout tip\&quot;&gt;\n  &lt;strong&gt;💡 Dica prática&lt;/strong&gt;&lt;br/&gt;\n  Não precisa decorar nomes difíceis agora. O importante é:\n  &lt;em&gt;onde apertar&lt;/em&gt; e &lt;em&gt;onde tocar&lt;/em&gt;.\n&lt;/div&gt;\n\n## ✋ 2. Primeiros acordes (já tocáveis)\n\nVamos usar **3 acordes estratégicos**:\n\n&lt;div class=\&quot;chord-grid\&quot;&gt;\n  &lt;div class=\&quot;chord-card\&quot;&gt;\n    &lt;span class=\&quot;name\&quot;&gt;D&lt;/span&gt;\n    &lt;div&gt;Ré maior&lt;/div&gt;\n    &lt;div class=\&quot;label\&quot;&gt;base / casa&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=\&quot;chord-card\&quot;&gt;\n    &lt;span class=\&quot;name\&quot;&gt;G&lt;/span&gt;\n    &lt;div&gt;Sol maior&lt;/div&gt;\n    &lt;div class=\&quot;label\&quot;&gt;caminho&lt;/div&gt;\n  &lt;/div&gt;\n  &lt;div class=\&quot;chord-card\&quot;&gt;\n    &lt;span class=\&quot;name\&quot;&gt;A&lt;/span&gt;\n    &lt;div&gt;Lá maior&lt;/div&gt;\n    &lt;div class=\&quot;label\&quot;&gt;tensão&lt;/div&gt;\n  &lt;/div&gt;\n&lt;/div&gt;\n\n**Por que esses?**\n👉 Porque com eles já dá pra tocar **muita música worship**.\n\n&lt;div class=\&quot;callout tip\&quot;&gt;\n  &lt;strong&gt;💡 Foco&lt;/strong&gt;\n  &lt;ul&gt;\n    &lt;li&gt;Som limpo (sem corda abafada)&lt;/li&gt;\n    &lt;li&gt;Troca lenta (não precisa velocidade ainda)&lt;/li&gt;\n  &lt;/ul&gt;\n&lt;/div&gt;\n\n## 🧠 3. Entendendo o \&quot;porquê\&quot; (introdução aos graus)\n\nAqui começa o diferencial da sua aula. Na tonalidade de **D (Ré maior)**:\n\n| Grau | Acorde | Função              |\n| ---- | ------ | ------------------- |\n| 1    | D      | base / descanso     |\n| 4    | G      | movimento           |\n| 5    | A      | tensão              |\n\n👉 Tradução simples:\n\n- **1 (D)** → casa (estabilidade)\n- **4 (G)** → caminho\n- **5 (A)** → cria expectativa\n\n&gt; 💥 **Isso é o que dá emoção à música worship.**\n\n## 🎶 4. Primeira música (já na aula!)\n\n**Sugestão:** \&quot;Quão Grande é o Meu Deus\&quot; (versão simplificada).\n\nProgressão básica:\n\n```text\nD  | G  | D  | A\nD  | G  | D  | A\n```\n\n&lt;div class=\&quot;callout\&quot;&gt;\n  Explique enquanto tocam:\n  &lt;ul&gt;\n    &lt;li&gt;Começa no &lt;strong&gt;1 (D)&lt;/strong&gt; → firme&lt;/li&gt;\n    &lt;li&gt;Vai pro &lt;strong&gt;4 (G)&lt;/strong&gt; → abre&lt;/li&gt;\n    &lt;li&gt;Volta pro &lt;strong&gt;1&lt;/strong&gt;&lt;/li&gt;\n    &lt;li&gt;Vai pro &lt;strong&gt;5 (A)&lt;/strong&gt; → cria tensão&lt;/li&gt;\n  &lt;/ul&gt;\n  👉 Eles vão &lt;em&gt;sentir&lt;/em&gt; a música, não só tocar.\n&lt;/div&gt;\n\n## 🪘 5. Ritmo simples (sem complicar)\n\nComece com a batida básica:\n\n&lt;div class=\&quot;strum\&quot; aria-label=\&quot;Padrão de batida: baixo, baixo, cima, cima, baixo, cima\&quot;&gt;\n  &lt;span&gt;↓&lt;/span&gt;&lt;span&gt;↓&lt;/span&gt;&lt;span&gt;↑&lt;/span&gt;&lt;span&gt;↑&lt;/span&gt;&lt;span&gt;↓&lt;/span&gt;&lt;span&gt;↑&lt;/span&gt;\n&lt;/div&gt;\n\nMas se for difícil:\n\n👉 **Só batida para baixo já resolve.**\n\n&lt;div class=\&quot;strum\&quot; aria-label=\&quot;Padrão simples: só batidas para baixo\&quot;&gt;\n  &lt;span&gt;↓&lt;/span&gt;&lt;span&gt;↓&lt;/span&gt;&lt;span&gt;↓&lt;/span&gt;&lt;span&gt;↓&lt;/span&gt;\n&lt;/div&gt;\n\n## 🔁 6. Prática guiada\n\nOrdem:\n\n1. Tocar acordes separados\n2. Treinar trocas (D → G → A)\n3. Aplicar na música\n4. Tocar junto (professor + alunos)\n\n&lt;div class=\&quot;callout tip\&quot;&gt;\n  &lt;strong&gt;💡 Importante&lt;/strong&gt;&lt;br/&gt;\n  Não corrija tudo. Corrija só o que &lt;em&gt;impede o som de sair&lt;/em&gt;.\n&lt;/div&gt;\n\n## 🙏 7. Aplicação espiritual\n\nConecte com propósito:\n\n- Música não é só técnica\n- Cada acorde ajuda a transmitir uma mensagem\n- Entender harmonia ajuda a tocar com **intencionalidade**\n\n## 📌 8. Tarefa da semana\n\n&lt;div class=\&quot;callout task\&quot;&gt;\n  &lt;strong&gt;📌 Para treinar até a próxima aula&lt;/strong&gt;\n  &lt;ul&gt;\n    &lt;li&gt;Treinar acordes: &lt;strong&gt;D, G, A&lt;/strong&gt;&lt;/li&gt;\n    &lt;li&gt;Treinar troca entre eles&lt;/li&gt;\n    &lt;li&gt;Tentar tocar a música (mesmo lento)&lt;/li&gt;\n  &lt;/ul&gt;\n&lt;/div&gt;\n\n## 🧩 Estratégia pedagógica (pra você que ensina)\n\nEssa aula funciona porque:\n\n- Já entrega resultado (eles tocam música no dia 1)\n- Introduz teoria sem pesar\n- Começa a formar entendimento (graus)\n- Mantém motivação alta\n\n---\n\nPronto pra próxima? **Aula 2 em breve**: trocas suaves de acordes + ritmo na batida. 🎸&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/aula-1-primeiro-contato.mdx&quot;],&quot;digest&quot;:[0,&quot;eb3c7e1d1266f165&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;blog&quot;]}]]]}" ssr client="load" opts="{&quot;name&quot;:&quot;SearchPosts&quot;,&quot;value&quot;:true}" await-children><!--[--><section id="search-posts"><!--[0--><div class="loading svelte-wkg5qg"><div class="spinner svelte-wkg5qg" style="--size: 24px" aria-label="Carregando"></div></div><!--]--></section><!--]--><!--astro:end--></astro-island> </div> </main> <footer> <div class="container"> <div class="top"> <a href="/"> <img width="64" height="64" src="/png/logo.png" alt="Guitar Lessons"> </a> <div class="footer-links"> <h4>Navegação</h4> <a href="/">Aulas</a> <a href="/about">Sobre</a> <a href="/search">Buscar</a> <a href="/politicas-de-privacidade">Políticas de Privacidade</a> </div> <div class="footer-links"> <h4>Recursos</h4> <a href="/rss.xml">RSS</a> <a href="https://github.com/ArthurRod" target="_blank" rel="noopener noreferrer">GitHub</a> </div> </div> <div class="bottom">
