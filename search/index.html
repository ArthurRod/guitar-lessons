s/client.svelte.Cs0QybAo.js" props="{&quot;posts&quot;:[1,[[0,{&quot;id&quot;:[0,&quot;aula-2-primeiro-acorde-do&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Aula 2 — Entendendo e montando o acorde de Dó (C)&quot;],&quot;description&quot;:[0,&quot;Aprenda como o acorde de Dó é formado, quais notas o compõem e por que cada dedo vai para cada posição no braço do violão.&quot;],&quot;author&quot;:[0,&quot;Arthur Rodrigues&quot;],&quot;tags&quot;:[0,&quot;violão, aula 2, acorde de dó, C maior, formação de acordes&quot;],&quot;pubDate&quot;:[3,&quot;2026-05-07T03:00:00.000Z&quot;],&quot;heroImage&quot;:[0,&quot;/aulas/aula-2/hero.png&quot;]}],&quot;body&quot;:[0,&quot;## Conectando com a Aula 1\n\nNa aula anterior você aprendeu que cada casa do violão representa um avanço de meio tom e conheceu as notas musicais.\n\nAgora vamos usar isso para montar nosso primeiro acorde: **Dó Maior (C)**.\n\n---\n\n## O que é um acorde?\n\nUm acorde é um conjunto de notas tocadas ao mesmo tempo.\n\nO acorde de **Dó Maior (C)** é formado por três notas:\n\n- C (Dó)\n- E (Mi)\n- G (Sol)\n\nEssas três notas vão aparecer distribuídas pelas cordas do violão.\n\n---\n\n## Montando o acorde de Dó\n\nPosicione os dedos da seguinte forma:\n\n- **3ª casa da corda A (5ª corda)** — dedo anelar\n- **2ª casa da corda D (4ª corda)** — dedo médio\n- **1ª casa da corda B (2ª corda)** — dedo indicador\n\nAs cordas G (3ª), B (2ª) e E aguda (1ª) soam, mas apenas a B é pressionada.  \nA corda E grave (6ª) **não deve ser tocada**.\n\n---\n\n## Por que cada dedo está naquela posição?\n\nNão é coincidência. Cada dedo está exatamente onde a nota que precisamos aparece no braço.\n\n### 5ª corda (A)\n\nA corda solta é **A (Lá)**.\n\nSubindo casa por casa:\n\n- Casa 1 → A# (Lá sustenido)\n- Casa 2 → B (Si)\n- **Casa 3 → C (Dó)** ← é aqui que precisamos\n\n---\n\n### 4ª corda (D)\n\nA corda solta é **D (Ré)**.\n\nSubindo casa por casa:\n\n- Casa 1 → D# (Ré sustenido)\n- **Casa 2 → E (Mi)** ← é aqui que precisamos\n\n---\n\n### 3ª corda (G)\n\nA corda solta é **G (Sol)**.\n\nNão precisamos pressionar nada — a corda solta já é a nota que queremos.\n\n---\n\n### 2ª corda (B)\n\nA corda solta é **B (Si)**.\n\nSubindo casa por casa:\n\n- **Casa 1 → C (Dó)** ← é aqui que precisamos\n\n---\n\n### 1ª corda (E aguda)\n\nA corda solta é **E (Mi)**.\n\nNão precisamos pressionar nada — a corda solta já dá a nota que queremos.\n\n---\n\n## Quais notas estamos tocando?\n\nQuando tocamos o acorde completo, cada corda produz uma nota:\n\n| Corda     | Situação       | Nota      |\n| --------- | -------------- | --------- |\n| E grave (6ª) | Não tocar   | —         |\n| A (5ª)    | Casa 3         | C (Dó)    |\n| D (4ª)    | Casa 2         | E (Mi)    |\n| G (3ª)    | Solta          | G (Sol)   |\n| B (2ª)    | Casa 1         | C (Dó)    |\n| E aguda (1ª) | Solta       | E (Mi)    |\n\nPerceba que apenas as notas **C, E e G** aparecem — exatamente as notas do acorde de Dó Maior.\n\nA mesma nota pode aparecer em mais de uma corda ao mesmo tempo. Isso é completamente normal.\n\n---\n\n## O que aprendemos?\n\nAgora você consegue:\n\n- Entender por que cada dedo está em determinada posição\n- Encontrar uma nota no braço partindo da corda solta\n- Montar o acorde de Dó sem apenas decorar um desenho\n- Relacionar as notas C, E e G com a posição no violão\n\n---\n\n## Prática da semana\n\n1. Monte o acorde devagar, dedo por dedo.\n2. Antes de pressionar cada dedo, fale em voz alta qual nota está sendo formada.\n3. Toque cada corda separadamente e confirme que está soando limpa.\n4. Identifique as notas C, E e G dentro do acorde enquanto toca.\n\nNa próxima aula vamos explorar um novo acorde e entender como ele se relaciona com o Dó.&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/aula-2-primeiro-acorde-do.mdx&quot;],&quot;digest&quot;:[0,&quot;abf35fb8167dc054&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;aula-1-primeiro-contato&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Aula 1 — Fundamentos do violão e notas musicais&quot;],&quot;description&quot;:[0,&quot;Primeiro contato com o violão: conheça suas partes, aprenda o nome das cordas e entenda as notas musicais, incluindo sustenidos.&quot;],&quot;author&quot;:[0,&quot;Arthur Rodrigues&quot;],&quot;tags&quot;:[0,&quot;violão, aula 1, iniciante, notas musicais, sustenido, cordas, fundamentos&quot;],&quot;pubDate&quot;:[3,&quot;2026-04-30T03:00:00.000Z&quot;],&quot;heroImage&quot;:[0,&quot;/aulas/aula-1/hero.png&quot;]}],&quot;body&quot;:[0,&quot;## Bem-vindo\n\nNesta primeira aula, você vai dar os primeiros passos no violão.  \nO objetivo não é decorar tudo, mas começar a entender o instrumento.\n\n---\n\n## Partes do violão\n\nAntes de tocar, é importante conhecer o instrumento:\n\n### Corpo\n\n- **Corpo** — responsável pela projeção do som  \n- **Boca** — abertura por onde o som se propaga  \n- **Cavalete** — sustenta as cordas no corpo do violão  \n- **Rastilho** — peça onde as cordas se apoiam no cavalete  \n- **Pinos** — fixam as cordas no corpo  \n- **Cordas** — responsáveis pela vibração e geração do som  \n- **Equalizador + Afinador** — presente em violões elétricos para controle de som  \n- **Jack (conector)** — entrada para ligar o violão em amplificadores  \n\n---\n\n### Braço\n\n- **Braço** — onde pressionamos as cordas  \n- **Escala** — superfície onde tocamos  \n- **Casas (trastes)** — divisões que determinam as notas  \n\n---\n\n### Mão\n\n- **Mão (headstock)** — parte final do braço  \n- **Tarraxas** — usadas para afinar as cordas  \n- **Pestana (nut)** — guia as cordas entre a mão e o braço  \n\n![Nomenclaturas do violão](/aulas/aula-1/aula-1-nomenclaturas.png)\n\nCom o tempo, isso vai se tornar natural.\n\n---\n\n## Nome das cordas\n\nO violão tem 6 cordas.\n\nDa mais grossa para a mais fina:\n\nE – A – D – G – B – E\n\nObservação:\n- Cordas mais grossas produzem sons mais graves (frequências mais baixas, medidas em Hz)  \n- Cordas mais finas produzem sons mais agudos (frequências mais altas, medidas em Hz)  \n\nIsso significa que o som nada mais é do que vibração: quanto mais lenta a vibração, mais grave; quanto mais rápida, mais agudo.\n\n---\n\n## Notas musicais\n\nAs notas são:\n\nC (Dó) – D (Ré) – E (Mi) – F (Fá) – G (Sol) – A (Lá) – B (Si)\n\nDepois disso, o ciclo se repete:\n\nC → D → E → F → G → A → B → C\n\nEssas são as **notas básicas** da música. A partir delas surgem outras variações (como sustenidos, menores e outras formas que veremos mais à frente).\n\n### Notas musicais sustenidas (#)\n\nO sustenido (#) indica que a nota sobe meio tom. Isso significa que o sustenido aparece **entre uma nota e outra**.\n\nVeja como funciona:\n\n- C (Dó) → **C#** → D (Ré)  \n- D (Ré) → **D#** → E (Mi)  \n- F (Fá) → **F#** → G (Sol)  \n- G (Sol) → **G#** → A (Lá)  \n- A (Lá) → **A#** → B (Si)  \n\nOu seja, o sustenido é a nota que fica **no meio do caminho** entre duas notas naturais.\n\nImportante:\n\n- Não existe sustenido entre E (Mi) e F (Fá)\n- Não existe sustenido entre B (Si) e C (Dó)\n\nIsso acontece porque essas notas já estão a apenas meio tom de distância.\n\n### Como isso aparece no violão?\n\nCada traste representa um avanço de meio tom.\n\nOu seja:\n\n- Cada casa que você sobe no braço corresponde a uma nova nota  \n- O violão segue um padrão lógico e repetitivo  \n\n### Exemplo na prática (corda E)\n\nNa corda mais grossa (E / Mi), temos:\n\n- Corda solta: **E (Mi)**  \n- 1ª casa: **F (Fá)**  \n- 2ª casa: **F# (Fá sustenido)**  \n- 3ª casa: **G (Sol)**  \n- 4ª casa: **G# (Sol sustenido)**  \n- 5ª casa: **A (Lá)**  \n\n### Visualização no braço\n\n![Nomenclaturas do violão](/aulas/aula-1/aula-1-braco-notas.png)\n\nObserve como a cada casa a nota avança meio tom. Esse mesmo padrão se repete em todas as cordas.\n\n---\n\n## Prática\n\nDurante a semana:\n\n- Fale o nome das cordas em voz alta  \n- Repita a sequência das notas  \n- Memorize onde existem sustenidos  \n- Observe o braço do violão enquanto pensa nas notas&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/aula-1-primeiro-contato.mdx&quot;],&quot;digest&quot;:[0,&quot;3b92ca87988be971&quot;],&quot;deferredRender&quot;:[0,true],&quot;collection&quot;:[0,&quot;blog&quot;]}]]]}" ssr client="load" opts="{&quot;name&quot;:&quot;SearchPosts&quot;,&quot;value&quot;:true}" await-children><!--[--><section id="search-posts"><!--[0--><div class="loading svelte-wkg5qg"><div class="spinner svelte-wkg5qg" style="--size: 24px" aria-label="Carregando"></div></div><!--]--></section><!--]--><!--astro:end--></astro-island> </div> </main> <footer> <div class="container"> <div class="top"> <a href="/"> <img width="64" height="64" src="/png/logo.png" alt="Guitar Lessons"> </a> <div class="footer-links"> <h4>Navegação</h4> <a href="/">Aulas</a> <a href="/about">Sobre</a> <a href="/search">Buscar</a> <a href="/politicas-de-privacidade">Políticas de Privacidade</a> </div> <div class="footer-links"> <h4>Recursos</h4> <a href="/rss.xml">RSS</a> <a href="https://github.com/ArthurRod" target="_blank" rel="noopener noreferrer">GitHub</a> </div> </div> <div class="bottom">
